schema_version: "1.0"
role: legend_clutter
base_model: yolo11x.pt
classes:
  - legend
  - clutter
train:
  workers: 8
  seed: 0
  deterministic: true
  pretrained: true
  optimizer: auto
  amp: true
  save: true
  val: true
  plots: true
  epochs: 500
  patience: 100
  batch: 32
  imgsz: 640
  save_period: -1
hyperparameters:
  close_mosaic: 10
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  cutmix: 0.0
